# ---------------------------------------------------------------------------
# BidTracker — two application containers plus an optional Cloudflare Tunnel.
#
# Design notes:
#
#  * SQLITE PERSISTENCE. The database lives on the named volume `bidtracker-data`
#    mounted at /data. It is the only stateful thing in this stack; everything
#    else is disposable. Never mount /data on a network filesystem (NFS, SMB,
#    most VPS "object storage" mounts) — SQLite's locking is unreliable there and
#    WAL mode makes it worse.
#
#  * ONE WRITER. The backend runs a single replica on purpose. SQLite permits
#    concurrent readers but serialises writers, and `numbering.service` relies on
#    a unique index rather than an in-process lock, so a second replica would be
#    *correct* but would spend its time retrying on SQLITE_BUSY. Scale vertically.
#
#  * NO PUBLISHED BACKEND PORT in the default configuration. The browser only
#    ever talks to the frontend, which proxies /api/* over the internal Docker
#    network. That means one hostname, no CORS, and a backend that is not
#    reachable from the internet even if the firewall is misconfigured.
# ---------------------------------------------------------------------------

services:
  backend:
    build:
      context: ./backend
    image: bidtracker-backend:latest
    container_name: bidtracker-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: file:/data/app.db
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-sol}

      # REQUIRED. Generate with: openssl rand -base64 48
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set — see .env.example}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}

      # First-boot admin. Only used when the database contains zero admins, so
      # changing the password in the UI is never undone by a restart.
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@bidtracker.com}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:?DEFAULT_ADMIN_PASSWORD must be set}

      # Behaviour switches — see .env.example for what each one does.
      DUPLICATE_SCOPE: ${DUPLICATE_SCOPE:-global}
      ENABLE_URL_ENRICHMENT: ${ENABLE_URL_ENRICHMENT:-true}
      URL_FETCH_CONCURRENCY: ${URL_FETCH_CONCURRENCY:-5}
      URL_FETCH_TIMEOUT_MS: ${URL_FETCH_TIMEOUT_MS:-6000}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      DISABLE_CRON: ${DISABLE_CRON:-false}
      ALLOW_BIDDER_PENDING_TO_REJECTED: ${ALLOW_BIDDER_PENDING_TO_REJECTED:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    volumes:
      - bidtracker-data:/data
    networks:
      - bidtracker
    healthcheck:
      # node -e rather than curl: curl isn't in the alpine base image, and adding
      # it just for a healthcheck is 2 MB for nothing.
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3001/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      args:
        # Empty = same-origin /api/*. Set only for a split-origin deployment.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    image: bidtracker-frontend:latest
    container_name: bidtracker-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Server-side rewrite target. Uses the Docker DNS name, so the backend
      # never needs a published port.
      BACKEND_INTERNAL_URL: http://backend:3001
    ports:
      # Bind to localhost only: the tunnel (or a reverse proxy on the same host)
      # is what exposes this. Change to "3000:3000" to serve directly.
      - '127.0.0.1:3000:3000'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - bidtracker
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3000/login',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # -------------------------------------------------------------------------
  # Optional: Cloudflare Tunnel. Enable with `docker compose --profile tunnel up -d`.
  #
  # This is the free path to a public HTTPS hostname with no open inbound ports
  # and no public IP — exactly the constraint in the brief. Create the tunnel in
  # the Cloudflare dashboard, point its public hostname at http://frontend:3000,
  # and put the token in .env.
  # -------------------------------------------------------------------------
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: bidtracker-tunnel
    restart: unless-stopped
    profiles: ['tunnel']
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - frontend
    networks:
      - bidtracker

volumes:
  bidtracker-data:
    # A named volume rather than a bind mount: Docker manages permissions, and
    # `docker volume inspect bidtracker-data` still gives you a host path for
    # backups. Swap to a bind mount (e.g. /srv/bidtracker/data:/data) if you
    # prefer the files somewhere you control directly.
    driver: local

networks:
  bidtracker:
    driver: bridge
